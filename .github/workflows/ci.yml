name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.11" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest
      - name: Lockfile matches the mock servers
        run: mcp-guard verify

  redteam:
    # The gate. Thresholds sit just inside the first full run (26/30 caught,
    # 3/25 benign flagged; see DESIGN.md), so one new miss or one new false
    # positive fails the build. Raise them when the numbers improve.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Red-team gate
        run: >
          mcp-guard redteam --out ci-results
          --min-catch 0.85 --max-fp 0.15
          --expect-report results/redteam_report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-report
          path: ci-results/
