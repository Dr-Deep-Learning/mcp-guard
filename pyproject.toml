[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-guard"
version = "0.1.0"
description = "A security gateway between a coding agent and its MCP tools (research prototype)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Amit Sethi" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mcp-guard = "mcp_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" for the library, "." for the dev-only mock/ and redteam/ packages.
pythonpath = ["src", "."]
addopts = "-ra"
